[project]
name = "joke-agent-lab"
version = "0.1.0"
description = "A small Streamlit, FastAPI, LangChain, and LangGraph learning project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.6.2,<2.0",
    "langgraph>=1.2.20,<2.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-langchain>=0.63.0",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.1,<2.0",
    "streamlit>=1.50,<2.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
